name: operating-layer-feature-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operating_layer_test
      POSTGRES_USER: operating_layer
      POSTGRES_PASSWORD: feature-test-only
    ports:
      - "55432:5432"
    volumes:
      - feature-test-postgres:/var/lib/postgresql/data
      - ./infrastructure/migrations/0001_core.sql:/docker-entrypoint-initdb.d/0001_core.sql:ro
      - ./infrastructure/migrations/0002_phase1_vertical_slice.sql:/docker-entrypoint-initdb.d/0002_phase1_vertical_slice.sql:ro
      - ./infrastructure/migrations/0003_phase1_closeout.sql:/docker-entrypoint-initdb.d/0003_phase1_closeout.sql:ro
      - ./infrastructure/migrations/0004_phase2_approval_resolution.sql:/docker-entrypoint-initdb.d/0004_phase2_approval_resolution.sql:ro
      - ./infrastructure/migrations/0005_phase2_internal_execution.sql:/docker-entrypoint-initdb.d/0005_phase2_internal_execution.sql:ro
      - ./infrastructure/migrations/0006_phase2_csv_batch_intake.sql:/docker-entrypoint-initdb.d/0006_phase2_csv_batch_intake.sql:ro
      - ./infrastructure/migrations/0007_phase3_gmail_draft.sql:/docker-entrypoint-initdb.d/0007_phase3_gmail_draft.sql:ro
      - ./infrastructure/migrations/0008_phase3_connector_credentials.sql:/docker-entrypoint-initdb.d/0008_phase3_connector_credentials.sql:ro
      - ./infrastructure/seeds/0001_local.sql:/docker-entrypoint-initdb.d/9001_local_seed.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U operating_layer -d operating_layer_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  feature-test-postgres:
