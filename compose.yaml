name: operating-layer-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-operating_layer}
      POSTGRES_USER: ${POSTGRES_USER:-operating_layer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/migrations/0001_core.sql:/docker-entrypoint-initdb.d/0001_core.sql:ro
      - ./infrastructure/migrations/0002_phase1_vertical_slice.sql:/docker-entrypoint-initdb.d/0002_phase1_vertical_slice.sql:ro
      - ./infrastructure/migrations/0003_phase1_closeout.sql:/docker-entrypoint-initdb.d/0003_phase1_closeout.sql:ro
      - ./infrastructure/migrations/0004_phase2_approval_resolution.sql:/docker-entrypoint-initdb.d/0004_phase2_approval_resolution.sql:ro
      - ./infrastructure/migrations/0005_phase2_internal_execution.sql:/docker-entrypoint-initdb.d/0005_phase2_internal_execution.sql:ro
      - ./infrastructure/migrations/0006_phase2_csv_batch_intake.sql:/docker-entrypoint-initdb.d/0006_phase2_csv_batch_intake.sql:ro
      - ./infrastructure/seeds/0001_local.sql:/docker-entrypoint-initdb.d/9001_local_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  object-storage:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-local-development}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
