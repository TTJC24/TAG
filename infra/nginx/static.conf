server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  error_page 403 /access-required.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /access-required.html {
    internal;
    root /etc/nginx/company-brain;
  }

  location / {
    if ($http_cf_access_authenticated_user_email = "") {
      return 403;
    }

    try_files $uri $uri/ =404;
  }
}
