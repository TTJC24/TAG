# Company Brain v3 Cloudflare Tunnel config template.
#
# This tunnel exposes the generated static site only. It does not route the
# guarded SQL query service, Postgres, /ask, a React app, or any writeback API.

tunnel: <UUID>
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Static Company Brain site generated into /opt/company-brain/dist.
  # The nginx container is internal-only; it has no host port binding.
  - hostname: <HOSTNAME>
    service: http://company-brain-static:8080

  # Catch-all: any hostname routed to this tunnel that is not matched above
  # gets a 404 from cloudflared itself.
  - service: http_status:404
