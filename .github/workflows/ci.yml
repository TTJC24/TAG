name: Company Brain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Fixture, provenance, answer, and type checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: company_brain
          POSTGRES_USER: company_brain
          POSTGRES_PASSWORD: company_brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U company_brain -d company_brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://company_brain:company_brain@localhost:5432/company_brain
      ZEROENTROPY_API_KEY: ci-placeholder-zeroentropy-key
      ANTHROPIC_API_KEY: ci-placeholder-anthropic-key
      COMPANY_BRAIN_API_TOKEN: ci-local-token
      COMPANY_BRAIN_API_PORT: 4317
      SCHEDULER_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate fixtures
        run: bun run fixtures:check

      - name: Validate source provenance
        run: bun run provenance:check

      - name: Validate source health and freshness
        run: bun run source-health:check

      - name: Validate source isolation and provenance refusal
        run: bun run source-isolation:check

      - name: Validate live readiness boundary
        run: bun run live-readiness:check

      - name: Generate and validate static fixture site
        run: |
          bun run static:seed-fixtures
          PAGEGEN_OUT_DIR=.tmp/company-brain-static-dist bun run pagegen
          bun run static:check --dist=.tmp/company-brain-static-dist --min-search-entries=1 --expect-build-commit
        env:
          COMPANY_BRAIN_ENGINE: postgres
          COMPANY_BRAIN_GIT_COMMIT: ${{ github.sha }}

      - name: Run fixture-mode smoke
        run: bun run smoke
        env:
          COMPANY_BRAIN_STORE_PATH: .tmp/company-brain-smoke/store.json
          PROCUREMENT_STORE_PATH: .tmp/company-brain-smoke/procurement-packets.json

      - name: Run fixture-mode API smoke
        run: bun run smoke:api
        env:
          COMPANY_BRAIN_STORE_PATH: .tmp/company-brain-api-smoke/store.json
          PROCUREMENT_STORE_PATH: .tmp/company-brain-api-smoke/procurement-packets.json

      - name: Evaluate citation metadata
        run: bun run eval:citations

      - name: Evaluate answer behavior
        run: bun run eval:answers

      - name: Typecheck
        run: bun run typecheck
